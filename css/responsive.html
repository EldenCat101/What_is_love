<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMFAO</title>

</head>

<style>
    .box {
        background-color: cyan;
        width: 100px;
        height: 100px;
    }

    @media (min-width: 500px) {
        .box {
            background-color: yellow;
            width: 250px;
            height: 250px;
        }
    }

    @media (min-width: 900px) {
        .box {
            background-color: magenta;
            width: 500px;
            height: 500px;
        }
    }

</style>

<body>
    <div class="box"></div>
</body>

</html>
